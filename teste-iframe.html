<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Globe Embed</title>
</head>
<body>

<iframe
  src="http://localhost:5173/"
  title="NAVPASS Globe"
  loading="lazy"
  allow="fullscreen"
  style="width:100%;height:100vh;border:0;display:block;"

  data-intro-animation="1"
  data-heatmap="1"
  data-flight-mode="reengineered"

  data-min-zoom-distance="14"
  data-max-zoom-distance="28"
  data-country-click-zoom-duration="1120"
  data-disable-scroll-zoom="0"
  data-scroll-resets-view="1"

  data-route-count="180"
  data-plane-density-scale="1.0"

  data-show-zoom-controls="1"
  data-show-breadcrumbs="1"
  data-breadcrumb-offset-left="50"
  data-breadcrumb-offset-top="92"
  data-show-country-card-close-button="1"
  data-animated-cards="1"
  data-disable-map-interaction="0"
  data-show-search-bar-mobile="0"

  data-accent-color="ECB200"
  data-card-border-color="rgba(255,255,255,0.08)"
  data-card-border-width="1"
  data-show-select-backing="0"
  data-show-country-glow="0"
  data-highlight-render-mode="line"

  data-bg-color="091320"
  data-country-line-color="4796FF"
  data-grid-main-color="B8C0CE"
  data-grid-effect-color="B8C0CE"
  data-glow-color="ffffff"
  data-hover-color="FBBC05"
  data-selected-color="ffffff"
  data-selected-accent-color="FBBC05"
  data-airport-dot-color="FBBC05"

  data-light-intensity="0"
  data-light-radius="0.30"
></iframe>

</body>
</html>

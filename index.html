<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAVPASS Globe</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #091320;
      }

      * {
        box-sizing: border-box;
      }

      canvas {
        display: block;
      }

      #left-rail {
        position: fixed;
        left: 28px;
        bottom: 64px;
        z-index: 5;
        display: grid;
        gap: 10px;
        pointer-events: auto;
      }

      .rail-button {
        width: 28px;
        height: 28px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(5, 16, 35, 0.38);
        color: rgba(255, 255, 255, 0.8);
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        transition: border-color 380ms ease, background 380ms ease, color 380ms ease;
      }

      .rail-button:hover {
        border-color: rgba(255, 255, 255, 0.46);
        background: rgba(5, 16, 35, 0.6);
        color: rgba(255, 255, 255, 0.95);
      }

      #country-search {
        position: fixed;
        right: 24px;
        top: 20px;
        z-index: 5;
        display: none;
        align-items: center;
        gap: 8px;
        pointer-events: auto;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(5, 16, 35, 0.48);
      }

      #country-search-input {
        width: min(250px, 52vw);
        height: 30px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(9, 19, 32, 0.92);
        color: rgba(255, 255, 255, 0.92);
        padding: 0 10px;
        font: 500 12px "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        letter-spacing: 0.2px;
      }

      #country-search-input::placeholder {
        color: rgba(255, 255, 255, 0.52);
      }

      #country-search-button {
        height: 30px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        background: rgba(18, 38, 64, 0.9);
        color: rgba(255, 255, 255, 0.9);
        padding: 0 12px;
        font: 600 12px "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        cursor: pointer;
        transition: border-color 220ms ease, background 220ms ease;
      }

      #country-search-button:hover {
        border-color: rgba(255, 255, 255, 0.44);
        background: rgba(26, 57, 96, 0.9);
      }

      #country-search.is-invalid #country-search-input {
        border-color: rgba(255, 196, 0, 0.95);
      }

      @media (max-width: 720px) {
        #country-search {
          display: flex;
          right: 12px;
          top: 12px;
          left: 12px;
        }
        #country-search-input {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <form id="country-search" role="search" aria-label="Country search">
      <input id="country-search-input" type="search" list="country-search-list" placeholder="Search country or ISO code" />
      <button id="country-search-button" type="submit">Search</button>
      <datalist id="country-search-list"></datalist>
    </form>
    <aside id="left-rail" aria-label="Zoom controls">
      <button id="rail-zoom-in" type="button" class="rail-button" aria-label="Zoom in">+</button>
      <button id="rail-zoom-out" type="button" class="rail-button" aria-label="Zoom out">-</button>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAVPASS Globe</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #091320;
      }

      * {
        box-sizing: border-box;
      }

      canvas {
        display: block;
      }

      #left-rail {
        position: fixed;
        left: 28px;
        bottom: 64px;
        z-index: 5;
        display: grid;
        gap: 10px;
        pointer-events: auto;
        align-items: start;
      }

      .rail-select {
        width: 260px;
        height: 30px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(5, 16, 35, 0.82);
        color: rgba(255, 255, 255, 0.9);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 11px;
        padding: 0 8px;
        cursor: pointer;
        outline: none;
        transition: border-color 280ms ease, background 280ms ease, color 280ms ease;
      }

      .rail-select:hover,
      .rail-select:focus {
        border-color: rgba(255, 255, 255, 0.46);
        background: rgba(5, 16, 35, 0.95);
        color: rgba(255, 255, 255, 0.98);
      }

      .rail-button {
        width: 28px;
        height: 28px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(5, 16, 35, 0.38);
        color: rgba(255, 255, 255, 0.8);
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        transition: border-color 380ms ease, background 380ms ease, color 380ms ease;
      }

      .rail-button:hover {
        border-color: rgba(255, 255, 255, 0.46);
        background: rgba(5, 16, 35, 0.6);
        color: rgba(255, 255, 255, 0.95);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <aside id="left-rail" aria-label="Zoom controls">
      <select id="rail-color-select" class="rail-select" aria-label="Color palette">
        <option value="current">Current: BG #091320 | Lines #122640</option>
        <option value="suggested_lines">Suggestion 1: BG #091320 | Lines #162f50</option>
        <option value="suggested_main_lines">Suggestion 2: BG #0D1C30 | Lines #1A3960</option>
      </select>
      <button id="rail-zoom-in" type="button" class="rail-button" aria-label="Zoom in">+</button>
      <button id="rail-zoom-out" type="button" class="rail-button" aria-label="Zoom out">-</button>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAVPASS Globe</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #091320;
      }

      * {
        box-sizing: border-box;
      }

      canvas {
        display: block;
      }

      #left-rail {
        position: fixed;
        left: 28px;
        bottom: 64px;
        z-index: 5;
        display: grid;
        gap: 10px;
        pointer-events: auto;
      }

      .rail-button {
        width: 28px;
        height: 28px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(5, 16, 35, 0.38);
        color: rgba(255, 255, 255, 0.8);
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        transition: border-color 380ms ease, background 380ms ease, color 380ms ease;
      }

      .rail-button:hover {
        border-color: rgba(255, 255, 255, 0.46);
        background: rgba(5, 16, 35, 0.6);
        color: rgba(255, 255, 255, 0.95);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <aside id="left-rail" aria-label="Zoom controls">
      <button id="rail-zoom-in" type="button" class="rail-button" aria-label="Zoom in">+</button>
      <button id="rail-zoom-out" type="button" class="rail-button" aria-label="Zoom out">-</button>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
